name: Build Pentagon Island v1.0.0 Installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'v1.0.0'

permissions:
  contents: read

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-desktop.txt
      - name: Package game and runtime
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name PentagonIsland --paths . --collect-all uvicorn --collect-all webview --collect-all fastapi --collect-all starlette --collect-all jinja2 --add-data 'templates;templates' --add-data 'static;static' desktop/launcher.py
          if (-not (Test-Path 'dist/PentagonIsland/PentagonIsland.exe')) { throw 'PyInstaller executable missing' }
      - name: Install Inno Setup 7
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Compile Windows installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "${env:ProgramFiles}\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) { throw 'Inno Setup compiler missing' }
          & $iscc 'installer/PentagonIsland.iss'
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed: $LASTEXITCODE" }
          if (-not (Test-Path 'release/PentagonIsland-Setup-v1.0.0.exe')) { throw 'Installer missing' }
      - name: Upload installer for testing
        uses: actions/upload-artifact@v4
        with:
          name: PentagonIsland-Setup-v1.0.0
          path: release/PentagonIsland-Setup-v1.0.0.exe
          if-no-files-found: error
